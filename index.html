body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --bg:#F5F2EC;--surface:#FFFFFF;--line:#E4DED3;--line2:#EEE9E0;--field:#FAF8F4;--chip:#EEE9E0;
  --fg:#1F2421;--muted:#5E625D;--chip-ink:#4A4D49;
  --accent:#2E5A4C;--accent-fg:#FFFFFF;--accent-soft:#E3ECE7;--accent-ink:#1F4036;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816;--surface:#1C211E;--line:#2E3531;--line2:#262C29;--field:#222824;--chip:#2A302C;
  --fg:#ECEAE4;--muted:#A3A79F;--chip-ink:#C9CCC4;
  --accent:#7FB8A3;--accent-fg:#10241C;--accent-soft:#22362E;--accent-ink:#A9D6C4;
  --warn-soft:#3A2E1B;--warn-ink:#E5C48F;--crit-soft:#3D2420;--crit-ink:#F0A894;--info-soft:#1E2D38;--info-ink:#9FC3DC;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816;--surface:#1C211E;--line:#2E3531;--line2:#262C29;--field:#222824;--chip:#2A302C;
  --fg:#ECEAE4;--muted:#A3A79F;--chip-ink:#C9CCC4;
  --accent:#7FB8A3;--accent-fg:#10241C;--accent-soft:#22362E;--accent-ink:#A9D6C4;
  --warn-soft:#3A2E1B;--warn-ink:#E5C48F;--crit-soft:#3D2420;--crit-ink:#F0A894;--info-soft:#1E2D38;--info-ink:#9FC3DC;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.4;padding-inline:16px}
#app{max-width:460px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--display);font-weight:600}
h1.display{font-size:36px;line-height:1.05}
h2.sec{font-size:15px;font-weight:600}
h2.sec .n{color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.list>*{border-bottom:1px solid var(--line2)}.list>*:last-child{border-bottom:0}
.item{padding:12px 14px;display:flex;align-items:center;gap:12px;min-height:44px;box-sizing:border-box}
.item .grow{flex:1;min-width:0}
.t{font-weight:600}
.time{width:46px;flex-shrink:0;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--accent-soft);color:var(--accent-ink)}
.p-warn{background:var(--warn-soft);color:var(--warn-ink)}
.p-crit{background:var(--crit-soft);color:var(--crit-ink)}
.p-info{background:var(--info-soft);color:var(--info-ink)}
.p-neutral{background:var(--chip);color:var(--chip-ink)}
.alert{border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.alert.crit{background:var(--crit-soft);color:var(--crit-ink)}
.alert.warn{background:var(--warn-soft);color:var(--warn-ink)}
.alert .grow{flex:1;min-width:0}
button,select,input,textarea{font:inherit;color:inherit}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.block{width:100%;min-height:50px}
.btn.ghost{border-color:var(--line);background:var(--field);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
select{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:0 8px;font-size:14px;max-width:150px}
select.unset{border-color:var(--crit-ink);color:var(--crit-ink)}
textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;background:var(--field);padding:10px 12px;font-size:14px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid4 .stat{padding:10px 8px}.grid4 .stat .v{font-size:22px}.grid4 .small{font-size:12px}
.tile{min-height:116px;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;color:var(--fg)}
.tile .t{font-size:16px}
.tile .sub{font-size:13px;color:var(--muted);margin-top:2px}
.tile .sub.crit{color:var(--crit-ink)}
.ico{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stat{border-radius:12px;padding:12px}
.stbtn{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;border:1.5px solid transparent;transition:border-color .15s,box-shadow .15s}
.stbtn.card{border:1px solid var(--line,#e6e1d8)}
.stbtn.on{border-color:currentColor;box-shadow:0 0 0 2px currentColor inset}
.stbtn:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.stat .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.back{background:none;border:0;color:var(--accent);font-size:15px;display:flex;align-items:center;gap:4px;min-height:44px;padding:0;cursor:pointer}
.brand{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.demo{font-size:12px;background:var(--warn-soft);color:var(--warn-ink);border-radius:10px;padding:8px 12px}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.hero{background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero .label{color:var(--accent-fg);opacity:.85}
.bar{height:6px;border-radius:999px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar>i.low{background:var(--crit-ink)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{height:36px;border-radius:8px;border:0;background:var(--chip);color:var(--chip-ink);font-size:13px;cursor:pointer}
.day.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-size:18px;cursor:pointer}
.step b{width:32px;text-align:center;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:44px;box-sizing:border-box;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.check.done .grow{text-decoration:line-through;color:var(--muted)}
.photo{border-radius:12px;padding:12px;min-height:104px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:6px;position:relative;overflow:hidden;cursor:pointer}
.photo.todo{background:var(--accent);color:var(--accent-fg)}
.photo.done{background:var(--accent-soft);color:var(--accent-ink)}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-size:14px;cursor:pointer}
.chip.on{background:var(--crit-soft);border-color:var(--crit-ink);color:var(--crit-ink)}
.tbl{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,1fr));gap:8px;padding:10px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.tbl>*:not(:first-child){text-align:right}
.tbl.head{font-size:12px;font-weight:600;color:var(--muted)}
.tbl.bad{background:var(--crit-soft)}
.tbl .neg{color:var(--crit-ink);font-weight:600}
.tbl .ok{color:var(--accent-ink)}
.roles{display:flex;flex-direction:column;gap:10px}
.role{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;color:var(--fg)}
.role .grow{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 48px);z-index:10}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sw{width:8px;height:8px;border-radius:999px;flex-shrink:0}
@page{margin:14mm}
@media print{

  .card,.item{break-inside:avoid}.item{min-height:0;padding:6px 10px}h1.display{font-size:26px}.view{animation:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

  al.map(function(a){var dn=S.spaDone[a.id];return '<div class="alert '+(dn?'':a.lvl)+'" style="'+(dn?'background:var(--surface);border:1px solid var(--line);color:var(--muted)':'')+'">'+ic(a.lvl==='crit'?'flame':'warn','currentColor')+'<div class="grow"><div class="t small">'+a.time+' · '+esc(a.txt)+'</div><div class="xs">'+esc(a.sub)+'</div></div>'+(dn?'<span class="pill p-ok">Fait · '+dn+'</span>':'<button class="btn" data-spa="'+a.id+'">Fait</button>')+'</div>';}).join('')+
  '<div class="card list">'+list.map(function(b){return '<div class="item" style="align-items:flex-start"><div class="time">'+b.start.slice(11,16)+'<div class="xs muted" style="font-weight:400">'+b.end.slice(11,16)+'</div></div><div class="grow"><div style="font-weight:500">'+esc(b.name)+'</div><div class="row" style="margin-top:6px;flex-wrap:wrap;gap:6px"><span class="pill p-neutral">Chambre non indiquée</span><span class="small muted">'+esc(b.guest)+(b.people>1?' · '+b.people+' pers.':'')+'</span></div>'+(b.paid?'':'<div class="xs" style="margin-top:6px;color:var(--warn-ink)">Non payé · règlement sur place</div>')+(b.message?'<div class="small" style="margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn-ink)">Message : '+esc(b.message)+'</div>':'')+'</div></div>';}).join('')+'</div></div>';
 }).join('')+'<button class="btn ghost block" data-act="spareload">Actualiser</button>';
};
V.cuisine=function(){
 var low=S.stock.filter(function(s){return s.q<s.min;});
 return back()+'<div><h1 class="display">Cuisine</h1><div class="small muted" style="margin-top:4px">Tarik · courses et stock</div></div>'+
 '<div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:8px"><div class="label">Prévu demain</div><div class="grid3"><div><div class="stat v" style="padding:0;font-size:24px">8</div><div class="small muted">Petits-déj</div></div><div><div class="stat v" style="padding:0;font-size:24px">2</div><div class="small muted">Déjeuners</div></div><div><div class="stat v" style="padding:0;font-size:24px">6</div><div class="small muted">Dîners</div></div></div></div>'+
 '<div class="stack"><h2 class="sec">Alertes <span class="n">· '+(low.length+1)+'</span></h2>'+low.map(function(s){return '<div class="alert crit">'+ic('warn','currentColor')+'<div class="grow"><div class="t small">Sous le seuil · '+esc(s.n.toLowerCase())+'</div><div class="small">'+s.q+s.u+' restants, seuil à '+s.min+s.u+'</div></div></div>';}).join('')+'<div class="alert warn">'+ic('warn','currentColor')+'<div class="grow"><div class="t small">À consommer vite · yaourts</div><div class="small">10 pots, date limite dans 2 jours</div></div></div></div>'+
 '<div class="stack"><div class="between"><h2 class="sec">Liste de courses</h2><span class="xs muted">Selon stock et réservations</span></div>'+
 S.shop.map(function(g,gi){return '<div class="label" style="margin-top:4px">'+esc(g.g)+'</div><div class="card list">'+g.items.map(function(it,ii){return '<label class="check'+(it.done?' done':'')+'"><input type="checkbox" data-shop="'+gi+'|'+ii+'"'+(it.done?' checked':'')+'><span class="grow" style="flex:1">'+esc(it.n)+'</span><span class="small" style="font-weight:600">'+esc(it.q)+'</span></label>';}).join('')+'</div>';}).join('')+
 (S.orderSent?'<div class="alert" style="background:var(--accent-soft);color:var(--accent-ink)">'+ic('ok','currentColor')+'<div class="grow small">Commande envoyée pour validation à la direction.</div></div>':'<button class="btn primary block" data-act="sendorder">Envoyer pour validation</button>')+'</div>'+
 '<div class="stack"><div class="between"><h2 class="sec">Stock</h2><span class="xs muted">En stock / seuil minimum</span></div><div class="card list">'+S.stock.map(function(s){var p=Math.min(100,Math.round(s.q/s.min*100*0.7));var lw=s.q<s.min;return '<div style="padding:12px 16px;display:flex;flex-direction:column;gap:6px"><div class="between small"><span>'+esc(s.n)+'</span><span style="font-weight:600;'+(lw?'color:var(--crit-ink)':'')+'">'+s.q+' / '+s.min+s.u+'</span></div><div class="bar"><i class="'+(lw?'low':'')+'" style="width:'+(lw?Math.round(s.q/s.min*100):100)+'%"></i></div></div>';}).join('')+'</div><label class="btn ghost block" style="display:flex;align-items:center;justify-content:center;gap:8px;position:relative">'+ic('cam')+'Photo d\'un ticket ou d\'une facture<input type="file" accept="image/*" capture="environment" data-file="ticket" style="position:absolute;inset:0;opacity:0"></label></div>';
};
V.achats=function(){
 var spent=S.buys.filter(function(b){return b.kind==='controle';}).reduce(function(s,b){return s+b.amount;},0)+1290;var budget=4000;
 var val=S.buys.filter(function(b){return b.kind==='valider';});var ctl=S.buys.filter(function(b){return b.kind==='controle';});
 function money(n){return n.toLocaleString('fr-FR')+' MAD';}
 return back()+'<div><h1 class="display">Contrôle des achats</h1><div class="small muted" style="margin-top:4px">Semaine (démo)</div></div>'+
 '<div class="hero"><div class="between"><span class="label">Dépensé cette semaine</span><span class="small">Budget '+money(budget)+'</span></div><div style="font-size:30px;font-weight:600;font-variant-numeric:tabular-nums">'+money(spent)+'</div><div class="bar" style="background:rgba(255,255,255,.25)"><i style="width:'+Math.round(spent/budget*100)+'%;background:var(--accent-fg)"></i></div></div>'+
 '<div class="stack"><h2 class="sec">À valider avant achat <span class="n">· '+val.filter(function(b){return b.state==='attente';}).length+'</span></h2>'+val.map(function(b){return '<div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:8px"><div class="between"><span class="t">'+esc(b.title)+'</span><span class="small muted">par '+esc(b.by)+'</span></div><div class="small">'+esc(b.detail)+'</div><div class="xs muted">Estimation '+money(b.amount)+'</div>'+(b.state==='attente'?'<div class="grid2"><button class="btn ghost" data-buy="'+b.id+'|question">Demander une modif</button><button class="btn primary" data-buy="'+b.id+'|ok">Valider</button></div>':stateLine(b))+'</div>';}).join('')+'</div>'+
 '<div class="stack"><h2 class="sec">Achats à contrôler <span class="n">· '+ctl.filter(function(b){return b.state==='attente';}).length+'</span></h2>'+ctl.map(function(b){return '<div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px'+(b.ticket?'':';border-color:var(--crit-ink)')+'"><div class="between"><span class="t">'+esc(b.title)+'</span><span class="t" style="font-variant-numeric:tabular-nums">'+money(b.amount)+'</span></div><div class="row" style="flex-wrap:wrap;gap:6px">'+(b.ticket?'<span class="pill p-ok">Ticket photographié</span>':'<span class="pill p-crit">Sans ticket</span>')+'</div><div class="stack" style="gap:4px;border-top:1px solid var(--line2);padding-top:10px">'+b.flags.map(function(f){return '<div class="small" style="color:var(--'+f[0]+'-ink)">'+esc(f[1])+'</div>';}).join('')+'</div>'+(b.state==='attente'?'<div class="grid2"><button class="btn ghost" data-buy="'+b.id+'|question">Demander à Tarik</button><button class="btn primary" data-buy="'+b.id+'|ok"'+(b.ticket?'':' disabled')+'>Approuver</button></div>':stateLine(b))+'</div>';}).join('')+'</div>'+
 '<div class="card" style="padding:14px 16px"><div class="label">La règle pour chaque achat</div><ol style="margin:8px 0 0;padding-left:20px;line-height:1.7" class="small"><li>Liste validée avant d\'acheter</li><li>Photo du ticket ou de la facture</li><li>Montant saisi</li><li>Quantités reçues vérifiées, stock mis à jour</li></ol></div>';
};
function stateLine(b){return b.state==='ok'?'<span class="pill p-ok" style="align-self:flex-start">Validé</span>':'<span class="pill p-warn" style="align-self:flex-start">Question envoyée à Tarik</span>';}

/* ---------- render & events ---------- */
var app=document.getElementById('app');
function render(){
 var v=!S.role?'roles':S.view;
 if(S.role&&!ACCESS[S.role]){S.role=null;v='roles';}
 if(v!=='roles'&&v!=='home'&&v!=='fiche'&&!can(v)){v='home';S.view='home';}
 if(S.role==='femme'&&v==='home'){v='mestaches';}
 if(v==='bdform'&&!S.draft){v='petitdej';S.view='petitdej';}
 app.innerHTML='<div class="view" style="display:flex;flex-direction:column;gap:18px">'+V[v]()+'</div>';
}
app.addEventListener('click',function(e){
 var el=e.target.closest('[data-role],[data-go],[data-act],[data-bdset],[data-bdint],[data-tab],[data-day],[data-step],[data-sig],[data-done],[data-spa],[data-buy],[data-nuit],[data-mfilter],[data-mday]');if(!el)return;
 if(el.dataset.mday){S.mday=+el.dataset.mday;S.mfilter=null;render();return;}
 if(el.dataset.mfilter){var mv=el.dataset.mfilter;S.mfilter=(mv==='tout'||S.mfilter===mv)?null:mv;render();return;}
 if(el.dataset.nuit){var nq=el.dataset.nuit.split('|');var cur0=S.nuit[nq[0]];if(cur0&&cur0.v===nq[1])delete S.nuit[nq[0]];else S.nuit[nq[0]]={v:nq[1],t:now()};render();return;}
 if(el.dataset.role){S.role=el.dataset.role;S.view='home';try{localStorage.setItem('anyssates-role',S.role);}catch(x){}render();window.scrollTo(0,0);return;}
 if(el.dataset.tab){LIVE.tab=el.dataset.tab;render();return;}
 if(el.dataset.go){go(el.dataset.go,el.dataset.p);return;}
 var a=el.dataset.act;
 if(a==='switch'){S.role=null;try{localStorage.removeItem('anyssates-role');}catch(x){}render();return;}
 if(a==='spareload'){loadSpa();return;}
 if(a==='print'){window.print();return;}
 if(a==='nuitdone'){S.nuitDone=now();toast('Nuit clôturée, la direction est prévenue');render();return;}
 if(a==='nuitctl'){S.nuitCtl=now();toast('Contrôle enregistré');render();return;}
 if(a==='bdnew'||a==='bdedit'){var rid=el.dataset.p||(sansFiche()[0]||S.rooms.filter(function(x){return x.status!=='libre';})[0]).id;S.draft=mkDraft(rid);go('bdform');return;}
 if(a==='bdaddp'){S.draft.pers.push({b:'',o:''});render();return;}
 if(a==='bddelp'){S.draft.pers.pop();render();return;}
 if(a==='bdsave'){var d=S.draft;var miss=d.pers.some(function(p){return !p.b||!p.o;});if(miss){toast('Choisissez une boisson et les œufs pour chaque personne');return;}S.bdf[d.room]={pers:d.pers,heure:d.heure,depart:d.depart,allerg:d.allerg.trim(),menu:d.menu,int:d.int};S.draft=null;toast('Fiche enregistrée · '+room(d.room).name);go('petitdej');return;}
 if(a==='sendplan'){toast('Planning envoyé. Chacune le retrouve demain matin.');return;}
 if(a==='linenret'){S.linenRet=true;toast('Retour validé');render();return;}
 if(a==='linensend'){S.linenSent=true;toast('Bon d\'envoi créé');render();return;}
 if(a==='sendorder'){S.orderSent=true;S.buys.unshift({id:'b'+Date.now(),kind:'valider',title:'Liste de courses de Tarik',by:'Tarik',detail:S.shop.map(function(g){return g.items.filter(function(i){return !i.done;}).map(function(i){return i.n;}).join(', ');}).filter(Boolean).join(' · '),amount:520,state:'attente'});toast('Envoyé à la direction pour validation');render();return;}
 if(a==='sendsig'){var r=room(el.dataset.p);var sig=S.signal[r.id]||{};var ks=Object.keys(sig).filter(function(k){return sig[k];});if(!ks.length&&!S.comment.trim()){toast('Choisissez un problème ou écrivez un commentaire');return;}S.issues.push({room:r.name,by:r.who||'Femme de chambre',txt:ks.concat(S.comment.trim()?[S.comment.trim()]:[]).join(', ')});S.signal[r.id]={};S.comment='';toast('Signalement envoyé à la gouvernante');render();return;}
 if(el.dataset.day){var p=el.dataset.day.split('|');var t=S.rec.find(function(x){return x.id===p[0];});var d=+p[1];var i=t.days.indexOf(d);if(i>=0)t.days.splice(i,1);else t.days.push(d);S.plan=null;render();return;}
 if(el.dataset.bdset){var q2=el.dataset.bdset.split('|');S.draft.pers[+q2[0]][q2[1]]=q2.slice(2).join('|');render();return;}
 if(el.dataset.bdint){var k=el.dataset.bdint;var ix=S.draft.int.indexOf(k);if(ix>=0)S.draft.int.splice(ix,1);else S.draft.int.push(k);render();return;}
 if(el.dataset.step){var q=el.dataset.step.split('|');var l=S.linen[+q[0]];l.send=Math.max(0,l.send+(+q[1]));render();return;}
 if(el.dataset.sig){var s=el.dataset.sig.split('|');S.signal[s[0]]=S.signal[s[0]]||{};S.signal[s[0]][s[1]]=!S.signal[s[0]][s[1]];render();return;}
 if(el.dataset.done){S.common.find(function(c){return c.id===el.dataset.done;}).done=now();toast('C\'est noté');render();return;}
 if(el.dataset.spa){S.spaDone[el.dataset.spa]=now();toast('C\'est noté');render();return;}
 if(el.dataset.buy){var b=el.dataset.buy.split('|');S.buys.find(function(x){return x.id===b[0];}).state=b[1];toast(b[1]==='ok'?'Validé':'Question envoyée à Tarik');render();return;}
});
app.addEventListener('change',function(e){
 var el=e.target;
 if(el.dataset.assign){room(el.dataset.assign).who=el.value||null;S.plan=null;render();toast('Attribution enregistrée');return;}
 if(el.dataset.plan){S.plan.find(function(t){return t.id===el.dataset.plan;}).who=el.value;render();return;}
 if(el.dataset.recwho){S.rec.find(function(t){return t.id===el.dataset.recwho;}).who=el.value;S.plan=null;toast('Responsable modifié');return;}
 if(el.dataset.recrepl){S.rec.find(function(t){return t.id===el.dataset.recrepl;}).repl=el.value;S.plan=null;toast('Remplaçante modifiée');return;}
 if(el.dataset.rest){S.rest[el.dataset.rest]=+el.value;S.plan=null;toast('Jour de repos modifié');return;}
 if(el.dataset.me){S.param=el.value;render();return;}
 if(el.dataset.nuitn){S.nuitN[el.dataset.nuitn]=el.value;return;}
 if(el.dataset.mdate){if(!el.value)return;S.mday=Math.round((new Date(el.value+'T12:00:00')-new Date(ymd(0)+'T12:00:00'))/864e5);S.mfilter=null;render();return;}
 if(el.dataset.bdroom){S.draft=mkDraft(el.value);render();return;}
 if(el.dataset.bdf){var key=el.dataset.bdf;S.draft[key]=el.type==='checkbox'?el.checked:el.value;return;}
 if(el.dataset.shop){var p=el.dataset.shop.split('|');var it=S.shop[+p[0]].items[+p[1]];it.done=el.checked;render();return;}
 if(el.dataset.file){if(el.files&&el.files[0])toast('Photo ajoutée');return;}
 if(el.dataset.photo){
  var q=el.dataset.photo.split('|');var r=room(q[0]);var f=el.files&&el.files[0];
  var done=function(url){if(q[1]==='in'){r.pin=now();r.imgIn=url;r.m='encours';toast('Photo d\'entrée enregistrée');}else{r.pout=now();r.imgOut=url;r.m='prete';r.mt=r.pout;toast(r.name+' est prête');}render();};
  if(f){var rd=new FileReader();rd.onload=function(){done(rd.result);};rd.onerror=function(){done(null);};rd.readAsDataURL(f);}else done(null);
 }
});
app.addEventListener('submit',function(e){if(e.target.dataset.teamform){e.preventDefault();var n=(document.getElementById('tm-n').value||'').trim();if(!n){toast('Indiquez le prénom');return;}var po=document.getElementById('tm-p').value;var rr=document.getElementById('tm-r').value;var men=/chambre|Gouvernante|nuit/.test(po);TEAM.push({n:n,p:po,menage:men,femme:/chambre/.test(po)});if(men)STAFF.push(n);if(/chambre/.test(po))FEMMES.push(n);if(rr)S.rest[n]=+rr;S.plan=null;toast(n+' ajouté(e) à l\'équipe');render();return;}if(e.target.dataset.pinform){e.preventDefault();var v=(document.getElementById('pin')||{}).value||'';if(!v.trim())return;LIVE.pin=v.trim();try{localStorage.setItem('anyssates-pin',LIVE.pin);}catch(x){}LIVE.error='';loadSpa();}});
app.addEventListener('input',function(e){if(e.target.dataset.comment)S.comment=e.target.value;if(e.target.dataset.bdf&&S.draft&&e.target.type!=='checkbox')S.draft[e.target.dataset.bdf]=e.target.value;});
render();
})();
</script>
